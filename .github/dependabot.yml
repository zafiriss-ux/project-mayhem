# Dependabot version updates.
# Cost: every Dependabot PR runs CI on GitHub Actions (private repo, Free plan,
# 2000 minutes/month), so updates are monthly and grouped into few PRs.
# Security updates (Dependabot alerts) are separate and still arrive as soon
# as an advisory is published.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "build(deps)"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
