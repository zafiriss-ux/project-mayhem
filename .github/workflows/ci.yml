name: CI — Deterministic Tests & Baseline Hardening

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  ruff-phase-a:
    name: Ruff Phase A (full repo, blocking)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff Gate 1 (ruff check .)
        run: python -m ruff check .

  ruff-phase-b:
    name: Ruff Phase B (clean folders, blocking)
    runs-on: ubuntu-latest
    needs: [ruff-phase-a]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff Phase B blocking gate (clean folders only)
        run: |
          BLOCKING_TARGETS=(
            titan/config
          )

          python -m ruff check "${BLOCKING_TARGETS[@]}"

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: pytest --tb=short -q

      - name: Run governance integration contract tests
        run: pytest tests/test_governance_integration.py -v

      - name: Run with coverage (governance modules)
        run: |
          pytest --cov=titan.science.governance_engine \
                 --cov=titan.science.governance_contracts \
                 --cov-report=term-missing \
                 --cov-fail-under=80 \
                 -q

  determinism:
    name: Determinism Guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run determinism check (3 runs must produce identical exit codes)
        run: |
          for i in 1 2 3; do
            echo "=== Run $i ==="
            pytest tests/test_governance_integration.py test_core_modules.py::TestGovernanceVo2AndFuelingGates -q --tb=short
          done

  env-policy:
    name: Environment Policy Baseline
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enforce governance_engine architecture lock
        run: |
          BASE_COMMIT="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD 2>/dev/null || git hash-object -t tree /dev/null)"

          if git diff --name-only "$BASE_COMMIT" HEAD | grep -qx 'titan/science/governance_engine.py'; then
            LAST_COMMIT_MSG="$(git log -1 --pretty=%B)"
            echo "Detected governance_engine.py change in latest commit."
            echo "$LAST_COMMIT_MSG" | grep -q 'ADR-0009' || {
              echo "ERROR: governance_engine.py changed without ADR-0009 reference in commit message."
              exit 1
            }
            echo "ADR-0009 reference found in commit message — OK"
          else
            echo "governance_engine.py unchanged in latest commit — lock check skipped"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify Python version is 3.11+
        run: python -c "import sys; assert sys.version_info >= (3, 11), f'Python 3.11+ required, got {sys.version}'"

      - name: Verify no pinned dependency conflicts
        run: pip install -r requirements.txt --dry-run 2>&1 | grep -v "^Requirement already"

      - name: Check for accidental .env files in commit
        run: |
          if git ls-files | grep -E '\.env$' | grep -v '\.example'; then
            echo "ERROR: .env files must not be committed"
            exit 1
          fi
          echo "No .env files found in tracked files — OK"

      - name: Run system check (module health)
        run: python system_check.py || true

  dependency-drift-audit:
    name: Dependency Drift Audit (unpinned + stale)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime + dev dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Audit unpinned dependencies in requirements files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          requirement_files = (Path("requirements.txt"), Path("requirements-dev.txt"))
          allowed_prefixes = ("-r", "--", "git+", "http://", "https://")
          version_pattern = re.compile(r"==")
          unpinned: list[str] = []

          for path in requirement_files:
              for line_number, raw_line in enumerate(path.read_text(encoding="utf-8").splitlines(), start=1):
                  line = raw_line.split("#", maxsplit=1)[0].strip()
                  if not line or line.startswith(allowed_prefixes):
                      continue
                  if not version_pattern.search(line):
                      unpinned.append(f"{path}:{line_number}:{line}")

          if unpinned:
              print("Unpinned dependencies detected:")
              for entry in unpinned:
                  print(f"- {entry}")
              raise SystemExit(1)

          print("All audited dependencies are pinned with ==")
          PY

      - name: Audit stale dependencies
        run: |
          python - <<'PY'
          import json
          import subprocess

          result = subprocess.run(
              ["python", "-m", "pip", "list", "--outdated", "--format=json"],
              check=True,
              capture_output=True,
              text=True,
          )
          outdated = json.loads(result.stdout)

          if outdated:
              print("Outdated dependencies detected:")
              for package in outdated:
                  print(
                      f"- {package['name']}: {package['version']} -> {package['latest_version']}"
                  )
              raise SystemExit(1)

          print("No outdated dependencies detected")
          PY

  complexity-budget:
    name: Complexity Budget (module count ceiling)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enforce titan module count ceiling
        run: |
          python - <<'PY'
          import pkgutil

          import titan
          from titan.config.thresholds import MODULE_COUNT_CEILING as module_ceiling

          module_count = len(
              [
                  module.name
                  for module in pkgutil.walk_packages(titan.__path__, prefix="titan.")
                  if "__" not in module.name
              ]
          )

          if module_count > module_ceiling:
              raise SystemExit(
                  f"Complexity budget exceeded: titan module count {module_count} > ceiling {module_ceiling}"
              )

          print(
              f"Complexity budget check passed: titan module count {module_count} <= ceiling {module_ceiling}"
          )
          PY

  phase4-observability:
    name: Phase 4 Observability & E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Phase 4 observability & SLO alert tests
        run: |
          pytest tests/test_phase4_observability_flows.py \
                 tests/test_phase4_slo_alerts.py \
                 tests/test_telegram_calibration_command.py \
                 tests/test_outcome_tracker_persistence.py \
                 tests/test_e2e_regression_suite.py \
                 tests/test_phase4_hygiene.py \
                 -v

      - name: Phase 4 coverage gate (outcome_tracker + intensity_governor)
        run: |
          pytest --cov=titan.science.outcome_tracker \
                 --cov=titan.science.intensity_governor \
                 --cov=titan.science.governance_engine \
                 --cov-report=term-missing \
                 --cov-fail-under=98 \
                 -q

      - name: Smoke checks (import + instantiate + 1 step)
        run: pytest test_main_smoke.py -q

  docs-consistency:
    name: Documentation Consistency Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run documentation consistency tests
        run: pytest tests/test_documentation_consistency.py -v

  claude-md-integrity:
    name: CLAUDE.md Integrity Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CLAUDE.md integrity tests
        run: pytest tests/test_claude_md_integrity.py -v

  phase8-ci-checks:
    name: Phase 8 CI Consistency Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Phase 8 CI consistency checks
        run: pytest tests/test_phase8_ci_checks.py -v

  invariant-naive-datetime:
    name: G-CI-02 No naive datetime.now()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: No naive datetime.now() in governance-critical modules
        run: |
          # Scope: governance-critical modules only.
          # Pre-existing debt in other modules tracked as OBS-042 (Phase 9).
          SCOPE_FILES=(
            titan/science/governance_engine.py
            titan/science/hrv_engine.py
            titan/orchestration/daily_coach.py
            titan/integrations/garmin_sync.py
            titan/core/database.py
          )
          if grep -n "datetime\.now()" "${SCOPE_FILES[@]}" \
             | grep -v "tz=" | grep -v "UTC" | grep -v "timezone" \
             | grep -v "#.*datetime\.now"; then
            echo "FAIL: naive datetime.now() found — violates HR-01/INV-02"
            exit 1
          fi

  invariant-insert-or-replace:
    name: G-CI-03 No INSERT OR REPLACE on multi-source tables
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: No INSERT OR REPLACE on multi-source tables
        run: |
          # Allowlist: single-source tables permitted to use INSERT OR REPLACE.
          # auth_users and degraded_mode_state are single-writer tables (database.py only).
          VIOLATIONS=$(grep -rn "INSERT OR REPLACE" titan/ --include="*.py" \
            | grep -v "athlete_profile" \
            | grep -v "auth_tokens" \
            | grep -v "auth_users" \
            | grep -v "degraded_mode_state" \
            | grep -v '"""' \
            | grep -v "#")
          if [ -n "$VIOLATIONS" ]; then
            echo "FAIL: INSERT OR REPLACE found — violates INV-09"
            echo "$VIOLATIONS"
            exit 1
          fi

  invariant-athlete-id-drop:
    name: G-CI-04 No del athlete_id in persistence paths
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: No del athlete_id in persistence paths
        run: |
          if grep -rn "del athlete_id\|del context\[.athlete_id.\]" \
             titan/ --include="*.py"; then
            echo "FAIL: athlete_id deleted in persistence path — violates INV-03/HR-06"
            exit 1
          fi

  invariant-nan-test-coverage:
    name: G-CI-05 Every governance gate has NaN boundary test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Every governance gate has NaN boundary test
        run: |
          # Extract gate names from governance_engine.py
          # Each gate function must have a corresponding test_*_nan_* in
          # test_governance_mutation.py
          python - <<'EOF'
          import ast, sys, re
          from pathlib import Path

          gov = Path("titan/science/governance_engine.py").read_text()
          tree = ast.parse(gov)
          gates = [
              n.name for n in ast.walk(tree)
              if isinstance(n, ast.FunctionDef)
              and ("gate" in n.name.lower() or "check_" in n.name.lower())
              and not n.name.startswith("_test")
          ]

          test_src = Path("tests/test_governance_mutation.py").read_text()
          missing = []
          for gate in gates:
              short = gate.replace("_gate", "").replace("check_", "")
              pattern = rf"test_.*{re.escape(short)}.*nan|test_nan.*{re.escape(short)}"
              if not re.search(pattern, test_src, re.IGNORECASE):
                  missing.append(gate)

          if missing:
              print(f"FAIL: No NaN test for gates: {missing}")
              print("Violates HR-04/G-CI-05")
              sys.exit(1)
          else:
              print(f"OK: {len(gates)} gates, all have NaN tests")
          EOF

  invariant-optimistic-defaults:
    name: G-CI-06 No optimistic .get() defaults in governance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: No optimistic .get() defaults in governance
        run: |
          python - <<'EOF'
          import ast, sys
          from pathlib import Path

          # Truly optimistic values: these cause gates to PASS when data is absent.
          # 0 / 0.0 / False are fail-closed (conservative) — excluded from set.
          OPTIMISTIC = {1.0, 1, 100.0, 100}
          SAFE_FUNCTIONS = {"_safe_float", "_safe_int"}

          src = Path("titan/science/governance_engine.py").read_text()
          src_lines = src.splitlines()
          tree = ast.parse(src)
          violations = []

          for node in ast.walk(tree):
              if (isinstance(node, ast.Call) and
                  isinstance(node.func, ast.Attribute) and
                  node.func.attr == "get" and
                  len(node.args) >= 2):
                  default = node.args[1]
                  if isinstance(default, ast.Constant) and default.value in OPTIMISTIC:
                      # Exclude priority rank defaults: rank=1 means "execute first"
                      # (most strict), not optimistic. These are ordering values, not
                      # safety-gate pass conditions.
                      source_line = src_lines[node.lineno - 1] if node.lineno <= len(src_lines) else ""
                      if "priority_vector.get(" in source_line:
                          continue  # skip rank ordering defaults
                      violations.append(
                          f"Line {node.lineno}: .get() with optimistic default "
                          f"{default.value!r} — violates ADR-0051/INV-05"
                      )

          if violations:
              print("FAIL: Optimistic .get() defaults in governance_engine.py:")
              for v in violations: print(f"  {v}")
              sys.exit(1)
          else:
              print("OK: No optimistic governance defaults found")
          EOF

  dependency-audit:
    name: Dependency CVE Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run CVE audit
        # GHSA-gc5v-m9x4-r6x2 is tracked manually in requirements.txt (requests bump)
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-gc5v-m9x4-r6x2

  invariant-athlete-isolation:
    name: G-CI-07 Athlete isolation invariant
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install ".[dev]" --quiet

      - name: Athlete isolation invariant
        run: pytest tests/test_athlete_isolation_invariant.py -v --tb=short

  alembic-freeze-guard:
    name: Alembic freeze guard (SQLite collision prevention)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Alembic freeze guard
        run: |
          # Alembic must not be invoked in SQLite mode
          # This guard prevents accidental schema collision
          if grep -r "alembic upgrade" scripts/ \
             Makefile 2>/dev/null | \
             grep -v "postgres\|POSTGRES"; then
            echo "ERROR: alembic upgrade found without postgres context. See alembic/README_FREEZE.md"
            exit 1
          fi
          echo "Alembic freeze: OK"
