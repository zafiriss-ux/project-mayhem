name: CI — Deterministic Tests & Baseline Hardening

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  ruff-phase-a:
    name: Ruff Phase A (target folders, warning)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff Phase A warning gate (target folders)
        run: |
          TARGET_FOLDERS=(
            titan/config
            titan/science
            titan/core
            titan/integrations
            titan/orchestration
            titan/features
            titan/ui
            launcher
          )

          python -m ruff check "${TARGET_FOLDERS[@]}"

  ruff-phase-b:
    name: Ruff Phase B (clean folders, blocking)
    runs-on: ubuntu-latest
    needs: [ruff-phase-a]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff Phase B blocking gate (clean folders only)
        run: |
          BLOCKING_TARGETS=(
            titan/config
            titan/core
            titan/integrations
            titan/orchestration
            titan/features
            titan/ui
            titan/science/governance_contracts.py
            titan/science/governance_engine.py
          )

          python -m ruff check "${BLOCKING_TARGETS[@]}"

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: pytest --tb=short -q

      - name: Run governance integration contract tests
        run: pytest tests/test_governance_integration.py -v

      - name: Run with coverage (governance modules)
        run: |
          pytest --cov=titan.science.governance_engine \
                 --cov=titan.science.governance_contracts \
                 --cov-report=term-missing \
                 --cov-fail-under=80 \
                 -q

  determinism:
    name: Determinism Guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run determinism check (3 runs must produce identical exit codes)
        run: |
          for i in 1 2 3; do
            echo "=== Run $i ==="
            pytest tests/test_governance_integration.py test_core_modules.py::TestGovernanceVo2AndFuelingGates -q --tb=short
          done

  env-policy:
    name: Environment Policy Baseline
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enforce governance_engine architecture lock
        run: |
          BASE_COMMIT="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"

          if git diff --name-only "$BASE_COMMIT" HEAD | grep -qx 'titan/science/governance_engine.py'; then
            LAST_COMMIT_MSG="$(git log -1 --pretty=%B)"
            echo "Detected governance_engine.py change in latest commit."
            echo "$LAST_COMMIT_MSG" | grep -q 'ADR-0009' || {
              echo "ERROR: governance_engine.py changed without ADR-0009 reference in commit message."
              exit 1
            }
            echo "ADR-0009 reference found in commit message — OK"
          else
            echo "governance_engine.py unchanged in latest commit — lock check skipped"
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify Python version is 3.11+
        run: python -c "import sys; assert sys.version_info >= (3, 11), f'Python 3.11+ required, got {sys.version}'"

      - name: Verify no pinned dependency conflicts
        run: pip install -r requirements.txt --dry-run 2>&1 | grep -v "^Requirement already"

      - name: Check for accidental .env files in commit
        run: |
          if git ls-files | grep -E '\.env$|\.env\.'; then
            echo "ERROR: .env files must not be committed"
            exit 1
          fi
          echo "No .env files found in tracked files — OK"

      - name: Run system check (module health)
        run: python system_check.py || true

  phase4-observability:
    name: Phase 4 Observability & E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Phase 4 observability & SLO alert tests
        run: |
          pytest tests/test_phase4_observability_flows.py \
                 tests/test_phase4_slo_alerts.py \
                 tests/test_telegram_calibration_command.py \
                 tests/test_outcome_tracker_persistence.py \
                 tests/test_e2e_regression_suite.py \
                 tests/test_phase4_hygiene.py \
                 -v

      - name: Phase 4 coverage gate (outcome_tracker + intensity_governor)
        run: |
          pytest --cov=titan.science.outcome_tracker \
                 --cov=titan.science.intensity_governor \
                 --cov=titan.science.governance_engine \
                 --cov-report=term-missing \
                 --cov-fail-under=98 \
                 -q

      - name: Smoke checks (import + instantiate + 1 step)
        run: pytest test_main_smoke.py -q
