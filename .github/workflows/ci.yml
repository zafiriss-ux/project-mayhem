name: CI — Deterministic Tests & Baseline Hardening

# Runner strategy: ubuntu-latest (GitHub-hosted). The repository is private on
# GitHub Free: 2000 Actions minutes/month, and every job is billed rounded up to
# a whole minute. Cost rules for this file:
#   - few jobs: cheap checks share one job instead of one job each;
#   - one full pytest run per Python version (coverage gates read its data);
#   - push runs only on main (PR branches are covered by the pull_request run);
#   - a newer push to the same PR cancels the older run;
#   - Python 3.13 also runs on main pushes and manual runs; every PR runs 3.12.
# Every gate from the previous layout is still enforced; only the grouping changed.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ruff-phase-a:
    name: Ruff Phase A (full repo, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        # Same Ruff as requirements-dev.txt, so Dependabot bumps reach CI too.
        run: python -m pip install "$(grep -E '^ruff==' requirements-dev.txt | cut -d' ' -f1)"

      - name: Run Ruff Gate 1 (ruff check .)
        run: python -m ruff check .

  ruff-phase-b:
    name: Ruff Phase B (clean folders, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ruff-phase-a]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        # Same Ruff as requirements-dev.txt, so Dependabot bumps reach CI too.
        run: python -m pip install "$(grep -E '^ruff==' requirements-dev.txt | cut -d' ' -f1)"

      - name: Run Ruff Phase B blocking gate (clean folders only)
        run: |
          BLOCKING_TARGETS=(
            titan/config
          )

          python -m ruff check "${BLOCKING_TARGETS[@]}"

  test:
    # PostgreSQL CI matrix absent by design:
    # TITAN_DB_BACKEND=postgres raises NotImplementedError until ADR-0044
    # full parity (Phase 8A). See Opus TR-13 + TECHNICAL_DEBT.md.
    # Also carries the former determinism, phase4-observability, docs-consistency,
    # claude-md-integrity and phase8-ci-checks jobs: their test files are part of
    # the full suite below, and their extra gates run as steps here.
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ruff-phase-a]
    strategy:
      fail-fast: true
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.12", "3.13"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Uses pip + requirements.txt (pinned).
        # uv.lock was removed (Opus 2026-05-25). See TD-UV-LOCK-UNUSED.
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full test suite (with coverage data for the gates below)
        run: |
          pytest --tb=short -q \
                 --cov=titan.science \
                 --cov-report=

      - name: Coverage gate — governance modules (>= 80%)
        run: |
          python -m coverage report \
            --include="titan/science/governance_engine.py,titan/science/governance_contracts.py" \
            --fail-under=80

      - name: Phase 4 coverage gate (outcome_tracker + intensity_governor) (>= 98%)
        run: |
          python -m coverage report \
            --include="titan/science/outcome_tracker.py,titan/science/intensity_governor.py,titan/science/governance_engine.py" \
            --fail-under=98

      - name: Run governance integration contract tests
        run: pytest tests/test_governance_integration.py -v --no-cov

      - name: Run determinism check (3 runs must produce identical exit codes)
        run: |
          for i in 1 2 3; do
            echo "=== Run $i ==="
            pytest tests/test_governance_integration.py tests/test_core_modules.py::TestGovernanceVo2AndFuelingGates -q --tb=short --no-cov
          done

      - name: Import architecture check
        run: lint-imports
        continue-on-error: false

      - name: Pylint (advisory)
        run: |
          pip install pylint==3.3.7 --quiet
          pylint titan/ \
            --disable=C,R,W0611,W0401 \
            --fail-under=7.0 \
            --output-format=text \
            2>&1 | tail -20 || true

      - name: Vulture dead code (advisory)
        run: |
          pip install vulture --quiet
          vulture titan/ \
            --min-confidence 80 \
            --exclude "titan/api/" \
            2>&1 | head -30 || true

  invariants:
    # Former jobs, one step each: env-policy, semgrep, G-CI-02..G-CI-07,
    # alembic-integrity, alembic-freeze-guard, backup-verify, runner-health.
    name: Invariants, policy and security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ruff-phase-a]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce governance_engine architecture lock
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # TD-CI-02: check ALL commits in the push, not just HEAD.
          # github.event.before is the SHA before the push; fall back to HEAD~1
          # for single-commit pushes or branch-creation events.
          BEFORE="${PUSH_BEFORE}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi

          CHANGED="$(git diff --name-only "$BEFORE" HEAD | grep '^titan/science/governance_engine\.py$' || true)"
          if [ -n "$CHANGED" ]; then
            echo "Detected governance_engine.py change across push range $BEFORE..HEAD"
            git log "$BEFORE..HEAD" --format="%s %b" | grep -q 'ADR-0009' || {
              echo "ERROR: governance_engine.py changed without ADR-0009 reference in any commit message."
              exit 1
            }
            echo "ADR-0009 reference found in push commit messages — OK"
          else
            echo "governance_engine.py unchanged in push range — lock check skipped"
          fi

      - name: Check for accidental .env files in commit
        run: |
          if git ls-files | grep -E '\.env$' | grep -v '\.example'; then
            echo "ERROR: .env files must not be committed"
            exit 1
          fi
          echo "No .env files found in tracked files — OK"

      - name: G-CI-02 No naive datetime.now() in governance-critical modules
        run: |
          # Scope: governance-critical modules only.
          # Pre-existing debt in other modules tracked as OBS-042 (Phase 9).
          SCOPE_FILES=(
            titan/science/governance_engine.py
            titan/science/hrv_engine.py
            titan/orchestration/daily_coach.py
            titan/integrations/garmin_sync.py
            titan/core/database.py
            titan/core/repositories/*.py
          )
          if grep -n "datetime\.now()" "${SCOPE_FILES[@]}" \
             | grep -v "tz=" | grep -v "UTC" | grep -v "timezone" \
             | grep -v "#.*datetime\.now"; then
            echo "FAIL: naive datetime.now() found — violates HR-01/INV-02"
            exit 1
          fi

      - name: G-CI-03 No INSERT OR REPLACE on multi-source tables
        run: |
          # Allowlist: single-source tables permitted to use INSERT OR REPLACE.
          # auth_users and degraded_mode_state are single-writer tables (DatabaseManager and its
          # repositories in titan/core/repositories/ only).
          VIOLATIONS=$(grep -rn "INSERT OR REPLACE" titan/ --include="*.py" \
            | grep -v "athlete_profile" \
            | grep -v "auth_tokens" \
            | grep -v "auth_users" \
            | grep -v "degraded_mode_state" \
            | grep -v '"""' \
            | grep -v "#" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "FAIL: INSERT OR REPLACE found — violates INV-09"
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: G-CI-04 No del athlete_id in persistence paths
        run: |
          if grep -rn "del athlete_id\|del context\[.athlete_id.\]" \
             titan/ --include="*.py"; then
            echo "FAIL: athlete_id deleted in persistence path — violates INV-03/HR-06"
            exit 1
          fi

      - name: G-CI-05 Every governance gate has NaN boundary test
        run: |
          # Extract gate names from governance_engine.py
          # Each gate function must have a corresponding test_*_nan_* in
          # test_governance_mutation.py
          python3 - <<'EOF'
          import ast, sys, re
          from pathlib import Path

          gov = Path("titan/science/governance_engine.py").read_text()
          tree = ast.parse(gov)
          gates = [
              n.name for n in ast.walk(tree)
              if isinstance(n, ast.FunctionDef)
              and ("gate" in n.name.lower() or "check_" in n.name.lower())
              and not n.name.startswith("_test")
          ]

          test_src = Path("tests/test_governance_mutation.py").read_text()
          missing = []
          for gate in gates:
              short = gate.replace("_gate", "").replace("check_", "")
              pattern = rf"test_.*{re.escape(short)}.*nan|test_nan.*{re.escape(short)}"
              if not re.search(pattern, test_src, re.IGNORECASE):
                  missing.append(gate)

          if missing:
              print(f"FAIL: No NaN test for gates: {missing}")
              print("Violates HR-04/G-CI-05")
              sys.exit(1)
          else:
              print(f"OK: {len(gates)} gates, all have NaN tests")
          EOF

      - name: G-CI-06 No optimistic .get() defaults in governance
        run: |
          python3 - <<'EOF'
          import ast, sys
          from pathlib import Path

          # Truly optimistic values: these cause gates to PASS when data is absent.
          # 0 / 0.0 / False are fail-closed (conservative) — excluded from set.
          OPTIMISTIC = {1.0, 1, 100.0, 100}
          SAFE_FUNCTIONS = {"_safe_float", "_safe_int"}

          src = Path("titan/science/governance_engine.py").read_text()
          src_lines = src.splitlines()
          tree = ast.parse(src)
          violations = []

          for node in ast.walk(tree):
              if (isinstance(node, ast.Call) and
                  isinstance(node.func, ast.Attribute) and
                  node.func.attr == "get" and
                  len(node.args) >= 2):
                  default = node.args[1]
                  if isinstance(default, ast.Constant) and default.value in OPTIMISTIC:
                      # Exclude priority rank defaults: rank=1 means "execute first"
                      # (most strict), not optimistic. These are ordering values, not
                      # safety-gate pass conditions.
                      source_line = src_lines[node.lineno - 1] if node.lineno <= len(src_lines) else ""
                      if "priority_vector.get(" in source_line:
                          continue  # skip rank ordering defaults
                      violations.append(
                          f"Line {node.lineno}: .get() with optimistic default "
                          f"{default.value!r} — violates ADR-0051/INV-05"
                      )

          if violations:
              print("FAIL: Optimistic .get() defaults in governance_engine.py:")
              for v in violations: print(f"  {v}")
              sys.exit(1)
          else:
              print("OK: No optimistic governance defaults found")
          EOF

      - name: Alembic freeze guard
        run: |
          # Alembic must not be invoked in SQLite mode
          # This guard prevents accidental schema collision
          if grep -r "alembic upgrade" scripts/ \
             Makefile 2>/dev/null | \
             grep -v "postgres\|POSTGRES"; then
            echo "ERROR: alembic upgrade found without postgres context. See alembic/README_FREEZE.md"
            exit 1
          fi
          echo "Alembic freeze: OK"

      - name: Assert alembic freeze notice intact
        run: |
          grep -q "FREEZE" \
            alembic/README_FREEZE.md || {
            echo "FAIL: Freeze notice \
          removed from alembic/README_FREEZE.md"
            exit 1
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify Python version is 3.12+
        run: python -c "import sys; assert sys.version_info >= (3, 12), f'Python 3.12+ required, got {sys.version}'"

      - name: Verify no pinned dependency conflicts
        # Runs before install: once installed, every line is "Requirement already",
        # grep -v prints nothing and exits 1.
        run: pip install -r requirements.txt --dry-run 2>&1 | grep -v "^Requirement already"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run system check (module health)
        # Informational: diagnoses import/threading problems; pytest suite is the real gate.
        run: python system_check.py || true

      - name: Check pytest available
        run: python -m pytest --version

      - name: G-CI-07 Athlete isolation invariant
        run: pytest tests/test_athlete_isolation_invariant.py -v --tb=short

      - name: Verify alembic migration chain
        run: |
          python3 - <<'PYEOF'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          cfg = Config('alembic.ini')
          sd = ScriptDirectory.from_config(cfg)
          heads = sd.get_heads()
          assert len(heads) == 1, (
              f'Multiple alembic heads: {heads}. '
              'Run alembic merge before merging PR.'
          )
          revs = list(sd.walk_revisions())
          print(f'Migration chain OK: '
                f'{len(revs)} revisions, '
                f'head={heads[0][:8]}')
          PYEOF

      - name: Backup integrity — create test DB + backup
        run: |
          python3 -c "
          import sqlite3, pathlib
          d = pathlib.Path('/tmp/titan_test')
          d.mkdir(exist_ok=True)
          (d/'backups').mkdir(exist_ok=True)
          conn = sqlite3.connect(str(d/'titan_core.db'))
          conn.execute('CREATE TABLE t (id INTEGER)')
          conn.execute('INSERT INTO t VALUES(1)')
          conn.commit()
          conn.close()
          import subprocess
          subprocess.run(['bash', 'scripts/backup.sh', str(d)], check=True)
          "

      - name: Backup integrity — verify
        run: python3 scripts/verify_backup.py /tmp/titan_test

      - name: Semgrep security scan
        run: |
          pip install semgrep --quiet
          semgrep --config \
            .semgrep/titan_rules.yaml \
            titan/ \
            --error \
            --quiet

  dependency-drift-audit:
    name: Dependency Drift Audit (unpinned + CVE gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit unpinned dependencies in requirements files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          requirement_files = (Path("requirements.txt"), Path("requirements-dev.txt"))
          allowed_prefixes = ("-r", "--", "git+", "http://", "https://")
          version_pattern = re.compile(r"==")
          unpinned: list[str] = []

          for path in requirement_files:
              for line_number, raw_line in enumerate(path.read_text(encoding="utf-8").splitlines(), start=1):
                  line = raw_line.split("#", maxsplit=1)[0].strip()
                  if not line or line.startswith(allowed_prefixes):
                      continue
                  if not version_pattern.search(line):
                      unpinned.append(f"{path}:{line_number}:{line}")

          if unpinned:
              print("Unpinned dependencies detected:")
              for entry in unpinned:
                  print(f"- {entry}")
              raise SystemExit(1)

          print("All audited dependencies are pinned with ==")
          PY

      - name: Install pip-audit
        run: pip install pip-audit

      - name: CVE-only dependency gate
        # pip-audit resolves the requirement files in its own isolated env;
        # installing the project here is not needed.
        run: |
          pip-audit -r requirements.txt \
            -r requirements-dev.txt \
            --format json \
            --output /tmp/audit.json || true

          python3 -c "
          import json, sys
          data = json.load(open('/tmp/audit.json'))
          vulns = [
              v for pkg in data.get('dependencies', [])
              for v in pkg.get('vulns', [])
              if v.get('fix_versions')
          ]
          if vulns:
              print('CVEs found:')
              for v in vulns:
                  print(f'  {v[\"id\"]}: '
                        f'{v[\"description\"][:80]}')
              sys.exit(1)
          print('No actionable CVEs found.')
          "

      - name: Runtime CVE audit (former dependency-audit job)
        run: pip-audit -r requirements.txt

  complexity-budget:
    name: Complexity Budget (module count ceiling)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enforce titan module count ceiling
        run: |
          python - <<'PY'
          import pkgutil

          import titan
          from titan.config.thresholds import MODULE_COUNT_CEILING as module_ceiling

          module_count = len(
              [
                  module.name
                  for module in pkgutil.walk_packages(titan.__path__, prefix="titan.")
                  if "__" not in module.name
              ]
          )

          if module_count > module_ceiling:
              raise SystemExit(
                  f"Complexity budget exceeded: titan module count {module_count} > ceiling {module_ceiling}"
              )

          print(
              f"Complexity budget check passed: titan module count {module_count} <= ceiling {module_ceiling}"
          )
          PY
