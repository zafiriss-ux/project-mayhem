name: CodeQL
on:
  # push and pull_request triggers disabled — GitHub default CodeQL setup is
  # active on this repo and conflicts with advanced configuration at SARIF
  # upload time ("cannot be processed when the default setup is enabled").
  # Weekly scheduled scan retained for security coverage.
  # Code scanning (SARIF upload) is not available on this private repository
  # without a paid plan, so every upload failed and the run went red. Results
  # are kept as a workflow artifact instead (upload: never).
  # To re-enable: disable default setup in repo Settings → Code security.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        upload: never
        output: codeql-results

    - name: Keep SARIF results as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: codeql-sarif-${{ matrix.language }}
        path: codeql-results
        retention-days: 30
