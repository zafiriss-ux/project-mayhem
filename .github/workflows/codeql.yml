name: CodeQL
on:
  # push and pull_request triggers disabled — GitHub default CodeQL setup is
  # active on this repo and conflicts with advanced configuration at SARIF
  # upload time ("cannot be processed when the default setup is enabled").
  # Weekly scheduled scan retained for security coverage.
  # To re-enable: disable default setup in repo Settings → Code security.
  schedule:
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        upload: always
