name: Docker smoke

# AGENTS T-PRA-29 (D-2): build both images, start the compose stack, write a
# marker, restart both containers, and check the marker survived, /readyz is
# ready and the worker came back. Runs scripts/docker_smoke_test.sh unchanged
# from how an operator runs it.
#
# Cost (private repo, GitHub Free, 2000 min/month): a run builds two images,
# a few minutes. It runs on every push to main that touches the runtime, and on
# pull requests only when they change what goes into the images or the stack.

on:
  push:
    branches: ["main"]
    paths:
      - "titan/**"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "requirements*.txt"
      - "pyproject.toml"
      - "scripts/docker_smoke_test.sh"
      - "scripts/generate_jwt_keys.sh"
      - "scripts/worker_healthcheck.py"
      - ".github/workflows/docker-smoke.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "docker-compose*.yml"
      - "requirements*.txt"
      - "pyproject.toml"
      - "titan/api/**"
      - "titan/worker/**"
      - "titan/config/settings.py"
      - "titan/core/database.py"
      - "titan/core/repositories/**"
      - "titan/core/schema.py"
      - "scripts/docker_smoke_test.sh"
      - "scripts/generate_jwt_keys.sh"
      - "scripts/worker_healthcheck.py"
      - ".github/workflows/docker-smoke.yml"
  workflow_dispatch:

concurrency:
  group: docker-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    name: Compose up, restart, persistence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Docker Hub limits anonymous pulls per IP, and the shared runners hit the
      # limit (429 Too Many Requests on python:3.12-slim, D-034). Pull Docker Hub
      # images through Google's public mirror instead; it needs no account.
      - name: Pull Docker Hub images through mirror.gcr.io
        run: |
          sudo mkdir -p /etc/docker
          sudo sh -c 'test -s /etc/docker/daemon.json || echo "{}" > /etc/docker/daemon.json'
          jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' /etc/docker/daemon.json \
            | sudo tee /etc/docker/daemon.json.new > /dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format 'Registry mirrors: {{.RegistryConfig.Mirrors}}'

      - name: Smoke test
        run: bash scripts/docker_smoke_test.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
