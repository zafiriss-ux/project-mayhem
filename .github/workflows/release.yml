name: Release

# AGENTS RE-02/RE-04: a release is a git tag vX.Y.Z on a commit already on main.
# The tag must equal the version in pyproject.toml (RE-01). The workflow builds
# the api and worker images and pushes them to GitHub Container Registry pinned
# to the tag, builds the Windows TITAN-vX.Y.Z-win64.zip, and creates the GitHub
# Release with the zip attached.
#
# Cost: runs only when a v* tag is pushed. The Windows job counts double against
# the free plan's Actions minutes (a few minutes per release). GHCR storage and
# transfer for this private repo come from the free plan's package quota; the
# account's spending limit stays at $0, so going over a quota blocks the run
# instead of billing.

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check tag ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag format, version and branch
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $tag is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          version="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "v${version}" != "$tag" ]; then
            echo "::error::Tag $tag does not match pyproject.toml version $version"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $tag points at a commit that is not on main"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  images:
    name: Docker images
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - name: Image prefix
        id: prefix
        run: echo "value=ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push titan-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: api
          push: true
          tags: ${{ steps.prefix.outputs.value }}/titan-api:${{ github.ref_name }}
          labels: org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push titan-worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: worker
          push: true
          tags: ${{ steps.prefix.outputs.value }}/titan-worker:${{ github.ref_name }}
          labels: org.opencontainers.image.version=${{ github.ref_name }}

  windows:
    name: Windows zip
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build TITAN.exe
        run: .\launcher\build.ps1

      - name: Package
        run: .\launcher\package.ps1 -Version "${{ needs.check.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: dist/TITAN-v${{ needs.check.outputs.version }}-win64.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: GitHub Release
    needs: [check, images, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A Release published from the GitHub page creates its tag first, so the
        # Release can already exist: then only attach the zip to it.
        run: |
          zip="TITAN-v${{ needs.check.outputs.version }}-win64.zip"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${zip}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${zip}" \
              --title "TITAN OS ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
