name: Python SAST
on:
  # Free static analysis that needs no account or token (D-030). Bandit blocks
  # on medium/high findings; DevSkim only reports. SARIF goes to code scanning
  # only while the repository is public (see codeql.yml); while private the
  # findings are listed in the job summary and kept as an artifact.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install Bandit
      run: python -m pip install "bandit[sarif]==1.9.4"

    - name: All findings as SARIF
      run: python -m bandit -r titan -q -f sarif -o bandit.sarif --exit-zero

    - name: List findings in the log and the job summary
      if: always()
      run: python scripts/sarif_summary.py "Bandit findings" bandit.sarif

    - name: Gate on medium and high findings
      run: python -m bandit -r titan -q -ll -ii

    - name: Upload to code scanning (public repository only)
      if: ${{ always() && !github.event.repository.private }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: bandit.sarif
        category: bandit

    - name: Keep SARIF as an artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: bandit-sarif
        path: bandit.sarif
        retention-days: 30

  devskim:
    name: DevSkim
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Run DevSkim
      uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6  # v1.0.16
      with:
        # Whole repository except tests, archives and tooling folders.
        ignore-globs: '**/.git/**,**/bin/**,**/tests/**,**/archive/**,**/.venv/**,**/node_modules/**'
        output-filename: devskim-results.sarif

    - name: List findings in the log and the job summary
      if: always()
      run: python3 scripts/sarif_summary.py "DevSkim findings" devskim-results.sarif

    - name: Upload to code scanning (public repository only)
      if: ${{ always() && !github.event.repository.private }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: devskim-results.sarif
        category: devskim

    - name: Keep SARIF as an artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: devskim-sarif
        path: devskim-results.sarif
        retention-days: 30
