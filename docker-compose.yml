volumes:
  titan-data:
  # AGENTS DR-01: backups live on their own volume, never on titan-data.
  titan-backups:
  # ADR-0067 D9.2, D6.3: the athletes' token key and the deletion record, never on titan-data
  # or titan-backups, so a copy of the data cannot decrypt tokens and a restore cannot undo a deletion.
  titan-secrets:

services:
  titan-api:
    build:
      context: .
      target: api
    env_file:
      - .env
    # M0-14: published on this machine only, never on every network interface.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - titan-data:/data
    environment:
      - TITAN_DATA_DIR=/data
      - TITAN_DB_BACKEND=sqlite
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]  # DevSkim: ignore DS162092
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on: []

  titan-worker:
    build:
      context: .
      target: worker
    env_file:
      - .env
    volumes:
      - titan-data:/data
      - titan-backups:/backups
      - titan-secrets:/secrets
      - ./scripts:/app/scripts:ro
    environment:
      - TITAN_DATA_DIR=/data
      - TITAN_BACKUP_DIR=/backups
      - TITAN_TOKEN_KEY_FILE=/secrets/athlete_token.key
      - TITAN_DELETION_RECORD_FILE=/secrets/deletions.jsonl
      - TITAN_DB_BACKEND=sqlite
    # AGENTS INV-23: unhealthy once the worker's heartbeat is older than 2x its 60s tick.
    healthcheck:
      test: ["CMD", "python", "scripts/worker_healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      titan-api:
        condition: service_healthy
