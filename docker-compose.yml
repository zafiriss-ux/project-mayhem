volumes:
  titan-data:
  # AGENTS DR-01: backups live on their own volume, never on titan-data.
  titan-backups:

services:
  titan-api:
    build:
      context: .
      target: api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - titan-data:/data
    environment:
      - TITAN_DATA_DIR=/data
      - TITAN_DB_BACKEND=sqlite
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on: []

  titan-worker:
    build:
      context: .
      target: worker
    env_file:
      - .env
    volumes:
      - titan-data:/data
      - titan-backups:/backups
      - ./scripts:/app/scripts:ro
    environment:
      - TITAN_DATA_DIR=/data
      - TITAN_BACKUP_DIR=/backups
      - TITAN_DB_BACKEND=sqlite
    restart: unless-stopped
    depends_on:
      titan-api:
        condition: service_healthy
