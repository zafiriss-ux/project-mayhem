volumes:
  titan-data:

services:
  titan-api:
    build:
      context: .
      target: api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - titan-data:/data
    environment:
      - TITAN_DATA_DIR=/data
      - TITAN_DB_BACKEND=sqlite
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on: []

  titan-worker:
    build:
      context: .
      target: worker
    env_file:
      - .env
    volumes:
      - titan-data:/data
    environment:
      - TITAN_DATA_DIR=/data
      - TITAN_DB_BACKEND=sqlite
    restart: unless-stopped
    depends_on:
      titan-api:
        condition: service_healthy
