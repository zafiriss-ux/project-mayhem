[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-mayhem"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==4.1.0",
    "hypothesis==6.100.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest-timeout==2.3.1",
    "httpx==0.27.2",
]

[tool.setuptools]
packages = ["titan"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=titan --cov-fail-under=80 --cov-report=term-missing"
markers = [
    "timeout: mark test with a timeout budget",
]
[tool.coverage.run]
source = ["titan"]
omit = ["*/tests/*", "test_*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import order)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (likely bugs / design issues)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["F401", "F811"]  # tests may re-import for fixture clarity
"tests/*.py" = ["F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy (static type checker) ────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true   # third-party stubs not always available
exclude = ["test_.*\\.py", "tests/"]
