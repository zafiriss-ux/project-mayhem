[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-mayhem"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "garminconnect==0.3.17",
    "requests==2.34.2",
    "pyTelegramBotAPI==4.37.0",
    "sqlalchemy==2.1.3",
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "pyjwt[crypto]==2.15.1",
    "bcrypt==5.0.0",
    "cryptography==50.0.2",
    "prometheus-client==0.26.0",
    "uvicorn",
    "import-linter==2.15",
    "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov==7.1.0",
    "hypothesis>=6.168.3,<7",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "pytest-timeout==2.4.0",
    "httpx==0.28.1",
]

[tool.setuptools]
packages = ["titan"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
markers = [
    "timeout: mark test with a timeout budget",
    "unit: isolated, no DB, no IO",
    "integration: uses DB or filesystem",
    "governance: tests a governance gate or invariant",
    "slow: > 1s wall time",
]
[tool.coverage.run]
source = ["titan"]
omit = ["*/tests/*", "test_*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import order)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (likely bugs / design issues)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return (mixed/inconsistent returns)
    "TRY", # tryceratops (exception handling patterns)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "TRY003", # long exception messages ok
    "TRY301", # abstracting raise to inner function is excessive refactoring
    "SIM108", # ternary not always clearer
    "RET504", # assignment before return ok
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["F401", "F811"]  # tests may re-import for fixture clarity
"tests/*.py" = ["F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy (static type checker) ────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true   # third-party stubs not always available
exclude = ["test_.*\\.py", "tests/"]
