[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-mayhem"
version = "5.8.2"
dynamic = ["dependencies", "optional-dependencies"]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["titan*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
markers = [
    "timeout: mark test with a timeout budget",
    "unit: isolated, no DB, no IO",
    "integration: uses DB or filesystem",
    "governance: tests a governance gate or invariant",
    "slow: > 1s wall time",
]
[tool.coverage.run]
source = ["titan"]
omit = ["*/tests/*", "test_*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import order)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (likely bugs / design issues)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return (mixed/inconsistent returns)
    "TRY", # tryceratops (exception handling patterns)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "TRY003", # long exception messages ok
    "TRY301", # abstracting raise to inner function is excessive refactoring
    "SIM108", # ternary not always clearer
    "RET504", # assignment before return ok
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["F401", "F811"]  # tests may re-import for fixture clarity
"tests/*.py" = ["F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy (static type checker) ────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true   # third-party stubs not always available
exclude = ["test_.*\\.py", "tests/"]
